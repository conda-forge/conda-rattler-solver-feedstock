context:
  version: "0.2.0"

package:
  name: conda-rattler-solver
  version: ${{ version }}

source:
  url: https://github.com/conda/conda-rattler-solver/archive/${{ version }}.tar.gz
  sha256: 3276b7a8cd63dfa64822c75e99e318b10f7e5a02ffb6c26cf5ab7db2b470562e

build:
  noarch: python
  script: SETUPTOOLS_SCM_PRETEND_VERSION="${{ version }}" python -m pip install . -vv
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >=${{ python_min }}
    - conda >=26.7.0
    - py-rattler >=0.26.0,<0.27.0a0

tests:
  - python:
      imports:
        - conda_rattler_solver.solver
      pip_check: true
      python_version: 
        - ${{ python_min }}.*
        - "*"
  - script:
      - python -m conda create --dry-run --solver=rattler --channel=conda-forge python

about:
  homepage: https://github.com/conda/conda-rattler-solver
  summary: 'The fast pixi solver, now in conda'
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - danyeaw
    - jaimergp
