# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
context:
  version: "0.2.0"
  # check a specific "latest" python instead of `*` (e.g. any old python)
  python_check_max: "3.15"

package:
  name: conda-rattler-solver
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/c/conda-rattler-solver/conda_rattler_solver-${{ version }}.tar.gz
  sha256: 00e50ac40d1b9ac4e98fb08ebaa20080db6e7dcbfb4e5a6748cf385dfe6df60e
  patches:
    # remove after release with https://github.com/conda/conda-rattler-solver/pull/180
    - 0000-relax-py-rattler.patch

build:
  number: 1
  noarch: python
  script:
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ version }}
    content:
      - python -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check --check-build-dependencies

requirements:
  host:
    - hatch-vcs >=0.2.0
    - hatchling >=1.12.2
    - pip
    - python ${{ python_min }}.*
  run:
    - py-rattler >=0.26.0,<0.28.0a0
    - python >=${{ python_min }}
  run_constraints:
    # commented out in `pyproject.toml#/project/requirements`
    - conda >=26.7.0

tests:
  - package_contents:
      strict: true
      site_packages:
        - conda_rattler_solver/**
        - conda_rattler_solver-${{ version }}.dist-info/**
  - python:
      imports: conda_rattler_solver
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - ${{ python_check_max }}.*
  - requirements:
      run:
        - conda
        - python ${{ python_min }}.*
        # verify solveability against a known-good version, even if not used
        # see https://github.com/conda-forge/py-rattler-feedstock/pull/108
        - py-rattler >=0.27.1 *_1
    script:
      - python -m conda create --dry-run --solver=rattler --channel=conda-forge python

about:
  homepage: https://pypi.org/project/conda-rattler-solver
  repository: https://github.com/conda/conda-rattler-solver
  summary: The fast pixi solver, now in conda
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - danyeaw
    - jaimergp
