context:
  version: "0.2.0"

package:
  name: conda-rattler-solver
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/conda-rattler-solver/conda_rattler_solver-${{ version }}.tar.gz
  sha256: 3276b7a8cd63dfa64822c75e99e318b10f7e5a02ffb6c26cf5ab7db2b470562e

build:
  number: 1
  noarch: python
  script:
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ version }}
    content:
      - python -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check --check-build-dependencies

requirements:
  host:
    - hatch-vcs
    - hatchling
    - pip
    - python ${{ python_min }}.*
  run:
    - conda >=26.7.0
    - py-rattler >=0.26.0,<0.28.0a0
    - python >=${{ python_min }}

tests:
  - package_contents:
      strict: true
      site_packages:
        - conda_rattler_solver/**
        - conda_rattler_solver-${{ version }}.dist-info/**
  - python:
      imports:
        - conda_rattler_solver.solver
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - python -m conda create --dry-run --solver=rattler --channel=conda-forge python

about:
  homepage: https://pypi.org/project/conda-rattler-solver
  repository: https://github.com/conda/conda-rattler-solver
  summary: The fast pixi solver, now in conda
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - danyeaw
    - jaimergp
