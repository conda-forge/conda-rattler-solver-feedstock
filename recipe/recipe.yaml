context:
  version: "26.11.0"

package:
  name: conda-rattler-solver
  version: ${{ version }}

source:
  url: https://github.com/conda/conda-rattler-solver/archive/${{ version }}.tar.gz
  sha256: 4e1c62b6ddf164f3b7424321e1af2a70290e0ff8af2dfbb88bfedd0f0d57e536

build:
  noarch: python
  script: SETUPTOOLS_SCM_PRETEND_VERSION="${{ version }}" python -m pip install . -vv
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling >=0.12.2
    - hatch-vcs
    - pip
  run:
    - python >=${{ python_min }}
    - conda >=26.7.0
    - py-rattler >=0.28.1,<0.29.0a0

tests:
  - python:
      imports:
        - conda_rattler_solver.solver
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - python -m conda create --dry-run --solver=rattler --channel=conda-forge python

about:
  homepage: https://github.com/conda/conda-rattler-solver
  summary: 'The fast, Rust-based solver for conda'
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - danyeaw
    - jaimergp
