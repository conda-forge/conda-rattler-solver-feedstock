# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
context:
  version: "0.2.0"
  # used in constraints and tests, but commented out in `pyproject.toml#/project/requirements`
  conda_min: "26.7.0"
  # used to check a specific "latest" python for solve instead of `*` (e.g. any old python)
  python_check_max: "3.15"
  # used to check a specific "latest" python for test (`conda` not yet available for 3.15)
  python_test_max: "3.14"
  # used to verify solveability against a known-good version, even if not used
  # see https://github.com/conda-forge/py-rattler-feedstock/pull/108
  known_good_py_rattler: py-rattler >=0.27.1 *_1
  # build up a test to run in a manual matrix
  pip_check: python -m pip check
  import_check: python -c "import conda_rattler_solver.solver"
  solve_check: python -m conda create --dry-run --solver=rattler --channel=conda-forge python
  smoke_test: ${{ pip_check }} && ${{ import_check }} && ${{ solve_check }}

package:
  name: conda-rattler-solver
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/c/conda-rattler-solver/conda_rattler_solver-${{ version }}.tar.gz
  sha256: 00e50ac40d1b9ac4e98fb08ebaa20080db6e7dcbfb4e5a6748cf385dfe6df60e
  patches:
    # remove after release with https://github.com/conda/conda-rattler-solver/pull/180
    - 0000-relax-py-rattler.patch

build:
  number: 1
  noarch: python
  script:
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ version }}
    content:
      - python -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check --check-build-dependencies

requirements:
  host:
    - hatch-vcs >=0.2.0
    - hatchling >=1.12.2
    - pip
    - python ${{ python_min }}.*
  run:
    - py-rattler >=0.26.0,<0.28.0a0
    - python >=${{ python_min }}
  run_constraints:
    - conda >=${{ conda_min }}

tests:
  - package_contents:
      strict: true
      site_packages:
        - conda_rattler_solver/**
        - conda_rattler_solver-${{ version }}.dist-info/**
  - python:
      imports: conda_rattler_solver
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - ${{ python_check_max }}.*
  - requirements:
      run:
        - conda ${{ conda_min }}.*
        - pip
        - python ${{ python_min }}.*
        - ${{ known_good_py_rattler }}
    script: ${{ smoke_test }}
  - requirements:
      run:
        - conda
        - pip
        - python ${{ python_test_max }}.*
        - ${{ known_good_py_rattler }}
    script: ${{ smoke_test }}

about:
  homepage: https://pypi.org/project/conda-rattler-solver
  repository: https://github.com/conda/conda-rattler-solver
  summary: The fast pixi solver, now in conda
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - danyeaw
    - jaimergp
